name: CI Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: CI Verify
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run configuration tests
        run: >-
          xcodebuild test
          -project DesktopWidgets.xcodeproj
          -scheme DesktopWidgets
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DesktopWidgetsTests"
          CODE_SIGNING_ALLOWED=NO

      - name: Build release app
        run: >-
          xcodebuild build
          -project DesktopWidgets.xcodeproj
          -scheme DesktopWidgets
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DesktopWidgetsRelease"
          CODE_SIGNING_ALLOWED=NO
