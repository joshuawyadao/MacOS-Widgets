name: CI Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI Verify
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run configuration tests
        run: >-
          xcodebuild test
          -project DesktopWidgets.xcodeproj
          -scheme DesktopWidgets
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DesktopWidgetsTests"
          -resultBundlePath "$RUNNER_TEMP/DesktopWidgetsTests.xcresult"
          -enableCodeCoverage YES
          CODE_SIGNING_ALLOWED=NO

      - name: Report test coverage
        run: >-
          xcrun xccov view
          --report
          --only-targets
          "$RUNNER_TEMP/DesktopWidgetsTests.xcresult"

      - name: Build release app
        run: >-
          xcodebuild build
          -project DesktopWidgets.xcodeproj
          -scheme DesktopWidgets
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DesktopWidgetsRelease"
          CODE_SIGNING_ALLOWED=NO
