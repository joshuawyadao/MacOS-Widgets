name: CI Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: CI Verify
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run configuration tests
        run: >-
          xcodebuild test
          -project DesktopWidgets.xcodeproj
          -scheme DesktopWidgets
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DesktopWidgetsTests"
          -resultBundlePath "$RUNNER_TEMP/DesktopWidgetsTests.xcresult"
          -enableCodeCoverage YES
          CODE_SIGNING_ALLOWED=NO

      - name: Report test coverage
        run: >-
          xcrun xccov view
          --report
          --only-targets
          "$RUNNER_TEMP/DesktopWidgetsTests.xcresult"

      - name: Build release app
        run: >-
          xcodebuild build
          -project DesktopWidgets.xcodeproj
          -scheme DesktopWidgets
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DesktopWidgetsRelease"
          CODE_SIGNING_ALLOWED=NO
