name: CI Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: CI Verify
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test installer and release safety
        run: |
          Scripts/test-personal-installation.sh
          Scripts/test-automatic-refresh.sh
          Scripts/test-package-personal-installer.sh
          Scripts/test-refresh-widget-runtime.sh
          RELEASE_TEST_REAL_XCODEBUILD=1 Scripts/test-release-notarized-dmg.sh

      - name: Run configuration tests
        run: >-
          xcodebuild test
          -project DesktopWidgets.xcodeproj
          -scheme DesktopWidgets
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DesktopWidgetsTests"
          -resultBundlePath "$RUNNER_TEMP/DesktopWidgetsTests.xcresult"
          -enableCodeCoverage YES
          CODE_SIGNING_ALLOWED=NO

      - name: Report test coverage
        run: >-
          xcrun xccov view
          --report
          --only-targets
          "$RUNNER_TEMP/DesktopWidgetsTests.xcresult"

      - name: Build release app
        run: >-
          xcodebuild build
          -project DesktopWidgets.xcodeproj
          -scheme DesktopWidgets
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DesktopWidgetsRelease"
          CODE_SIGNING_ALLOWED=NO

      - name: Archive unsigned Developer ID configuration
        run: |
          xcodebuild archive -quiet \
            -project DesktopWidgets.xcodeproj -scheme DesktopWidgets \
            -configuration Release -destination 'generic/platform=macOS' \
            -xcconfig Config/DeveloperID.xcconfig \
            -archivePath "$RUNNER_TEMP/DesktopWidgetsDistribution.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DesktopWidgetsDistribution" \
            DEVELOPMENT_TEAM=ABC123DE45 CODE_SIGNING_ALLOWED=NO
          /usr/libexec/PlistBuddy -c 'Print :DesktopWidgetsDistributionChannel' \
            "$RUNNER_TEMP/DesktopWidgetsDistribution.xcarchive/Products/Applications/DesktopWidgets.app/Contents/Info.plist" | /usr/bin/grep -qx developer-id
